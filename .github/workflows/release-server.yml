name: Server Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-server:
    name: Build Server and Agent packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "${{ inputs.version }}"
          }
          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw "Version must look like v1.2.3; got $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test Go packages
        run: go test ./...

      - name: Package Server and Agent
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/package-server.ps1 `
            -Version "${{ steps.meta.outputs.version }}" `
            -Runtime "linux-x64,linux-arm64" `
            -OutputDir "artifacts/server"

      - uses: actions/upload-artifact@v7
        with:
          name: ip-multiviewer-server-${{ steps.meta.outputs.version }}
          path: artifacts/server/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/server/*
