          [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString() -ceq 'X64') 'LOCAL_OS_ARCH'
          $checks.hosted_runner='CANDIDATE_REQUIRES_SERVICE_JOB_MATCH'
          Text $nm '^[A-Za-z0-9][A-Za-z0-9_. -]*$' 128
          Text $env:ImageOS '^[A-Za-z0-9_.-]+$' 64;Text $env:ImageVersion '^[A-Za-z0-9_.-]+$' 64
          N ($PSVersionTable.PSVersion.Major -eq 7 -and $PSVersionTable.PSEdition -ceq 'Core') 'PS7_REQUIRED'
          $self=[Diagnostics.Process]::GetCurrentProcess()
          try{$shell=[IO.Path]::GetFullPath($self.MainModule.FileName)}catch{Reject 'UNKNOWN_SHELL'}finally{$self.Dispose()}
          N ([string]::Equals($shell,'C:\Program Files\PowerShell\7\pwsh.exe',[StringComparison]::OrdinalIgnoreCase)) 'SHELL_PATH'
          N ($env:PATH -ceq 'C:\Program Files\PowerShell\7') 'SHELL_SEARCH_PATH'
          Modules
          $before=[IO.FileInfo]::new($shell);$size=$before.Length;$write=$before.LastWriteTimeUtc
          $file=[IO.File]::Open($shell,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::Read)
          try{$hash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($file)).ToLowerInvariant()}finally{$file.Dispose()}
          $after=[IO.FileInfo]::new($shell)
          N ($after.Length -eq $size -and $after.LastWriteTimeUtc -eq $write) 'SHELL_CHANGED'
          $ev.runner_observation=@{
          source='CONTEXT_AND_LOCAL_NOT_ATTESTATION'
          runner_type=$re;runner_name=$nm;runner_group=$null
          runner_group_status='PENDING_SERVICE_JOB_RECONCILIATION';os='windows';architecture='amd64';image_label='windows-2025'
          image_identity=$env:ImageOS;image_version=$env:ImageVersion;shell_path=$shell;shell_version=$PSVersionTable.PSVersion.ToString()
          shell_sha256=$hash;shell_size=$size.ToString($inv)
          os_version=[Environment]::OSVersion.Version.ToString();runtime_version=[Runtime.InteropServices.RuntimeInformation]::FrameworkDescription
          }
          $checks.os_image_shell='OBSERVED_PENDING_EXTERNAL'
          N (-not [string]::IsNullOrWhiteSpace($env:CI0_CONTENT_TOKEN)) 'CONTENT_TOKEN_MISSING'
          $handler=[Net.Http.HttpClientHandler]::new()
          $handler.AllowAutoRedirect=$false;$handler.UseCookies=$false;$handler.AutomaticDecompression=[Net.DecompressionMethods]::None
          $client=[Net.Http.HttpClient]::new($handler);$client.Timeout=[Threading.Timeout]::InfiniteTimeSpan
          $client.DefaultRequestVersion=[Version]::new(1,1);$client.DefaultVersionPolicy=[Net.Http.HttpVersionPolicy]::RequestVersionExact
          foreach($pin in $pins){$ev.source_checks+=(SourceRead $pin)}
          $script:phase='BINDING'
          if($sc -ceq 'inventory-only'){
          Window $c['issued_at'] $c['expires_at'];Window $p['issued_at'] $p['expires_at']
          $checks.binding='BLOCKED_NO_BINDING';Reject 'BLOCKED_NO_BINDING'
          }
          $b=Record $bj $bd
          Shape $b 'schema,status,binding_id,binding_revision,repository_id,workflow_sha,workflow_content_sha256,source_commit,runner_type,os,architecture,image_label,image_identity,image_version,profile_id,profile_version,profile_sha256,allowed_trigger,allowed_scope,issued_at,expires_at,revocation_state,revocation_revision,revocation_evidence_ref,environment_protection_ref,bootstrap_runtime_ref,clock_policy_ref' 'workflow_identity,runner_group,permission_profile,approval_identity' 'ci1_execution_authorized'
          Match $b @{schema='ipmv.stage0c.ci0-runner-binding.proposal.v1';status='APPROVED_ACTIVE';repository_id=$repoId
          workflow_sha=$ws;workflow_content_sha256=$c['workflow_content_sha256'];source_commit=$source
          runner_type='github-hosted';os='windows';architecture='amd64';image_label='windows-2025'
          image_identity=$env:ImageOS;image_version=$env:ImageVersion;profile_id='ipmv-core-purego-v1';profile_version='1';profile_sha256=$profile
          allowed_trigger='workflow_dispatch';allowed_scope='CI0_RUNNER_BINDING_RECONCILIATION_ONLY';revocation_state='VALID'
          revocation_revision=$p['binding_revocation_revision'];environment_protection_ref=$c['environment_protection_ref']
          bootstrap_runtime_ref=$c['bootstrap_runtime_ref'];clock_policy_ref=$c['clock_policy_ref']}
          Ref $b['binding_id'];U64 $b['binding_revision'];U64 $b['revocation_revision']
          Ref $b['revocation_evidence_ref'];Approval $b['approval_identity']
          Shape $b['workflow_identity'] 'repository,path,ref'
          Match $b['workflow_identity'] @{repository=$repo;path='.github/workflows/core-runtime-bootstrap.yml';ref='refs/heads/main'}
          Shape $b['runner_group'] 'state,service_evidence_ref' '' '' 'id,name'
          Match $b['runner_group'] @{state='STANDARD_HOSTED_NOT_APPLICABLE';id=$null;name=$null}
          Ref $b['runner_group']['service_evidence_ref']
          $ev.binding_ref=@{binding_id=$b['binding_id'];binding_revision=$b['binding_revision'];digest=$bd;revocation_revision=$b['revocation_revision']}
          $checks.binding='RECORD_MATCH_PENDING_EXTERNAL'
          $script:phase='PERMISSION_AND_ENVIRONMENT'
          Permission $b['permission_profile']
          $ev.permission_evidence_ref=$c['permission_evidence_ref'];$ev.environment_evidence_ref=$c['environment_protection_ref']
          $checks.permission='RECORD_MATCH_PENDING_EXTERNAL'
          $checks.environment='PENDING_EXTERNAL_APPROVAL_HISTORY'
          Window $c['issued_at'] $c['expires_at'];Window $p['issued_at'] $p['expires_at'];Window $b['issued_at'] $b['expires_at']
          $ev.status='CANDIDATE_MATCH_PENDING_INDEPENDENT_RECONCILIATION'
          $script:reason='LOCAL_CHECKS_COMPLETE_NOT_CI0_PASS';$exitCode=0
          }catch{
          $ev.status='FAILED'
          if($script:reason.StartsWith('UNKNOWN_',[StringComparison]::Ordinal)){$ev.status='UNKNOWN'}
          if($script:reason -ceq 'BLOCKED_NO_BINDING'){$ev.status='BLOCKED_NO_BINDING'}
          $exitCode=1
          }finally{
          if($null -ne $client){$client.Dispose()};if($null -ne $handler){$handler.Dispose()}
          $ev.reason=$script:reason;$ev.phase=$script:phase
          $ev.get_count=$script:getCount.ToString($inv)
          $ev.observed_at=[DateTimeOffset]::UtcNow.UtcDateTime.ToString("yyyy-MM-dd'T'HH:mm:ss.fffffff'Z'",$inv)
          try{
          U64 $ri;U64 $ra
          $bytes=$utf8.GetBytes((Canonical $ev))
          N ($bytes.Length -gt 0 -and $bytes.Length -le 262144) 'EVIDENCE_SIZE'
          $digest=Hex $bytes;$count=[int][Math]::Ceiling($bytes.Length/12288.0)
