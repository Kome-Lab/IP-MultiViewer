          for($offset=0;$offset -lt $bytes.Length;$offset+=12288){$chunks.Add([Convert]::ToBase64String($bytes,$offset,[Math]::Min(12288,$bytes.Length-$offset)))}
          $frame='run='+$ri+' attempt='+$ra+' job=ci0 size='+
          $bytes.Length.ToString($inv)+' chunks='+
          $count.ToString($inv)+' sha256='+$digest
          [Console]::WriteLine('IPMV_CI0_EVIDENCE_V1 BEGIN '+$frame)
          for($i=0;$i -lt $chunks.Count;$i++){
          [Console]::WriteLine('IPMV_CI0_EVIDENCE_V1 CHUNK run='+$ri+' attempt='+$ra+
          ' job=ci0 index='+($i+1).ToString($inv)+' data='+$chunks[$i])
          }
          N (-not [string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) 'SUMMARY_CHANNEL_MISSING'
          $summary='CI-0 candidate evidence; final CI0_PASS is not issued here.'+[Environment]::NewLine+
          'Run '+$ri+' / attempt '+$ra+' / job ci0'+[Environment]::NewLine+
          'Envelope SHA-256: '+$digest+[Environment]::NewLine+'Result: '+$ev.status+'; CI-1 authorization: false.'+[Environment]::NewLine
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY,$summary,$utf8)
          [Console]::WriteLine('IPMV_CI0_EVIDENCE_V1 END '+$frame)
          }catch{
          [Console]::Error.WriteLine('IPMV_CI0_EVIDENCE_V1 INCOMPLETE evidence_or_summary_failure')
          $exitCode=1
          }
          }
          exit $exitCode
