# PREPARATION ONLY. Not dispatched, committed, pushed, or enabled by B4/B5.
name: Core Runtime Foundation (manual, gated, non-GPU)
on:
  workflow_dispatch:
    inputs:
      confirm_separate_execution_approval:
        description: "Separate user and repository execution authorization already recorded"
        type: boolean
        required: true
        default: false
      build_core:
        description: "Run source/tests/build/security on approved REAL Core targets"
        type: boolean
        required: true
        default: false
      run_integration:
        description: "Separate isolated non-GPU integration approval is present"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: core-foundation-${{ github.ref }}
  cancel-in-progress: false
env:
  GOTOOLCHAIN: local
  GOENV: off
  GOWORK: off
  GOFLAGS: -mod=readonly
  CGO_ENABLED: "0"
  GOTELEMETRY: "off"
  IPMV_CORE_EXECUTION_PERMIT: SEPARATELY_APPROVED_NON_GPU_CORE
  IPMV_APPROVED_SOURCE_COMMIT: ${{ vars.IPMV_CORE_APPROVED_COMMIT }}
  IPMV_CORE_TARGETS_SHA256: ${{ vars.IPMV_CORE_TARGETS_SHA256 }}
jobs:
  dependency-validation:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Kome-Lab/IP-MultiViewer' &&
      inputs.confirm_separate_execution_approval &&
      vars.IPMV_CORE_APPROVED_COMMIT == github.sha &&
      vars.IPMV_CORE_EXECUTION_ENABLED == 'SEPARATELY_APPROVED_NON_GPU_CORE'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.4"
          check-latest: false
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.10"
          check-latest: false
      - name: Validate exact graph without mutation
        run: >-
          python scripts/core-runtime/foundation.py dependency
          --goos linux --goarch amd64 --output "${{ runner.temp }}/core-dependency"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: core-dependency-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-dependency/*.json
          if-no-files-found: error
          retention-days: 14
  source-and-unit:
    needs: dependency-validation
    if: inputs.build_core
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            goos: windows
          - runner: ubuntu-24.04
            goos: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.4"
          check-latest: false
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.10"
          check-latest: false
      - name: Static source analysis (approved packages only)
        run: >-
          python scripts/core-runtime/foundation.py static --goos ${{ matrix.goos }}
          --goarch amd64 --output "${{ runner.temp }}/core-checks"
      - name: Unit tests (native host execution)
        run: >-
          python scripts/core-runtime/foundation.py unit --goos ${{ matrix.goos }}
          --goarch amd64 --output "${{ runner.temp }}/core-checks"
      - name: Isolated integration tests (separate authorization)
        if: inputs.run_integration && vars.IPMV_CORE_INTEGRATION_ENABLED == 'APPROVED_ISOLATED_NON_GPU'
        env:
          IPMV_INTEGRATION_PERMIT: APPROVED_ISOLATED_NON_GPU
        run: >-
          python scripts/core-runtime/foundation.py integration --goos ${{ matrix.goos }}
          --goarch amd64 --output "${{ runner.temp }}/core-checks"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: core-checks-${{ matrix.goos }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-checks/*.json
          if-no-files-found: error
          retention-days: 14
  compile-and-evidence:
    needs: source-and-unit
    if: inputs.build_core
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            goos: windows
            goarch: amd64
          - runner: windows-2025
            goos: windows
            goarch: arm64
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.4"
          check-latest: false
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.10"
          check-latest: false
      - name: Verify target dependency graph
        run: >-
          python scripts/core-runtime/foundation.py dependency --goos ${{ matrix.goos }}
          --goarch ${{ matrix.goarch }} --output "${{ runner.temp }}/core-output"
      - name: Compile assigned non-GPU Core entrypoints
        run: >-
          python scripts/core-runtime/foundation.py build --goos ${{ matrix.goos }}
          --goarch ${{ matrix.goarch }} --output "${{ runner.temp }}/core-output"
      - name: Generate actual-artifact SBOMs (future)
        run: >-
          python scripts/core-runtime/foundation.py sbom --goos ${{ matrix.goos }}
          --goarch ${{ matrix.goarch }} --output "${{ runner.temp }}/core-output"
          --tools "${{ runner.temp }}/core-tools"
      - name: License evidence and unresolved scope report
        run: >-
          python scripts/core-runtime/foundation.py license --goos ${{ matrix.goos }}
          --goarch ${{ matrix.goarch }} --output "${{ runner.temp }}/core-output"
      - name: Scan exact versions (future, no automatic suppression)
        run: >-
          python scripts/core-runtime/foundation.py vulnerability --goos ${{ matrix.goos }}
          --goarch ${{ matrix.goarch }} --output "${{ runner.temp }}/core-output"
          --tools "${{ runner.temp }}/core-tools"
      - name: Hash and unsigned review evidence
        run: >-
          python scripts/core-runtime/foundation.py evidence --goos ${{ matrix.goos }}
          --goarch ${{ matrix.goarch }} --output "${{ runner.temp }}/core-output"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: core-candidate-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-output/
          if-no-files-found: error
          retention-days: 14
# No PR/push/release/schedule/workflow_run trigger, secrets, OIDC, signing, publish or self-hosted.
